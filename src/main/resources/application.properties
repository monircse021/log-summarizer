# ============================================================================
# Log Summarizer - Application Configuration
# ============================================================================

# --- Application ------------------------------------------------------------
spring.application.name=log-summarizer

# --- Server -----------------------------------------------------------------
server.port=8080
# Let in-flight requests finish on SIGTERM (zero-downtime k8s rolling deploys)
server.shutdown=graceful

# --- Jackson (JSON handling) ------------------------------------------------
# Render OffsetDateTime as ISO-8601 strings, not numeric arrays
spring.jackson.serialization.write-dates-as-timestamps=false
# Tolerate small payload differences between API versions
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Gemini API Config ------------------------------------------------------
# Override the api-key via environment variable: GEMINI_API_KEY
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-2.5-flash
gemini.api-key=${GEMINI_API_KEY:CHANGE_ME}
gemini.timeout-ms=30000
# Low temperature -> deterministic, factual summaries
gemini.temperature=0.2
gemini.max-output-tokens=2048

# --- Resilience4j Circuit Breaker -------------------------------------------
resilience4j.circuitbreaker.instances.gemini.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gemini.sliding-window-size=20
resilience4j.circuitbreaker.instances.gemini.minimum-number-of-calls=10
# >=50% failures opens the breaker
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gemini.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gemini.record-exceptions[0]=com.inovace.logsummarizer.exception.UpstreamServiceException
resilience4j.circuitbreaker.instances.gemini.record-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.gemini.record-exceptions[2]=java.io.IOException

# --- Resilience4j Retry -----------------------------------------------------
resilience4j.retry.instances.gemini.max-attempts=3
resilience4j.retry.instances.gemini.wait-duration=500ms
# Exponential back-off avoids thundering-herd during partial outages
resilience4j.retry.instances.gemini.enable-exponential-backoff=true
resilience4j.retry.instances.gemini.exponential-backoff-multiplier=2
resilience4j.retry.instances.gemini.retry-exceptions[0]=com.inovace.logsummarizer.exception.UpstreamServiceException
resilience4j.retry.instances.gemini.retry-exceptions[1]=java.util.concurrent.TimeoutException

# --- OpenAPI / Swagger UI ---------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when-authorized
# Enable /actuator/health/liveness & /readiness for k8s
management.endpoint.health.probes.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.inovace.logsummarizer=DEBUG
# WebClient request/response - turn to DEBUG only when troubleshooting
logging.level.org.springframework.web.reactive.function.client=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
