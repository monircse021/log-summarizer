services:
  log-summarizer:
    build: .
    container_name: log-summarizer
    ports:
      - "8080:8080"
    environment:
      # Provide your real key here or via a .env file:
      #   echo "GEMINI_API_KEY=AIza..." > .env
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in environment or .env}
      # Optional overrides:
      # GEMINI_MODEL: gemini-2.5-flash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
